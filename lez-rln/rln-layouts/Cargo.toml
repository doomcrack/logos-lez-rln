[package]
name = "rln-layouts"
version = "0.2.0"
edition = "2024"

[features]
default = ["std"]
std = []

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
borsh = { version = "1", default-features = false, features = ["derive"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
  "rln-layouts",
]

[package]
name = "logos-lez-rln"
version = "0.1.0"
edition = "2024"

[lib]
name = "logos_lez_rln"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# LEZ crates fetched as git deps (lee/lee_core aliased as nssa/nssa_core so the
# source keeps its historical import names). Pinned by tag so a fresh clone
# builds with no sibling checkout.
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", features = ["client"] }
sequencer_service_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
# The indexer serves the registration program's events (`getEvents`), which
# readers rebuild the membership tree from (`src/zone`). Its RPC trait carries
# subscriptions, so the client is jsonrpsee's WebSocket one, at the version
# sequencer_service_rpc already resolves.
indexer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", features = ["client"] }
indexer_service_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
jsonrpsee = { version = "0.26", features = ["ws-client"] }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
borsh = { version = "1", features = ["derive"] }

rln-layouts = { path = "rln-layouts" }

# External dependencies
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"
bytemuck = "1.24.0"
rln = { version = "3.0.0", default-features = false }
rand_chacha = "0.3"
serde_json = "1"
# The program loader accepts only the protocol's default kernel; run_setup
# decodes the .bin and compares its kernel before creating any deploy
# accounts. Pinned to the versions lee already resolves.
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"

[features]
rc5-state-tests = []
rc5-state-tests-privacy = ["rc5-state-tests"]

[[bin]]
name = "run_rln_proof"
path = "src/bin/run_rln_proof.rs"

[[bin]]
name = "run_setup"
path = "src/bin/run_setup.rs"

[[bin]]
name = "mint_payer"
path = "src/bin/mint_payer.rs"

[[bin]]
name = "fund_account"
path = "src/bin/fund_account.rs"

[[bin]]
name = "register_member"
path = "src/bin/register_member.rs"

[[bin]]
name = "account_balance"
path = "src/bin/account_balance.rs"

[dev-dependencies]
nssa = { package = "lee", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", features = ["test-utils"] }
# Cycle harness (src/cycle_harness.rs) drives the guest through the same
# risc0 executor the sequencer uses, to measure per-execution user cycles
# against the 2^25 session cap. Pinned to the version nssa already resolves.
# Only the `client` executor is needed (default_executor); dropping default
# features avoids pulling bonsai-sdk into the dev build.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }

[workspace.dependencies]
rln-layouts = { path = "rln-layouts", default-features = false }

# Phase A lint policy: low-churn structural hygiene + correctness. Mirrored into
# the guest workspace (methods/guest/Cargo.toml) since it can't inherit these.
# Deferred to a tracked Phase B follow-up (higher churn on the current tree):
#   unwrap_used, allow_attributes / allow_attributes_without_reason,
#   arithmetic_side_effects, indexing_slicing, and the cast-discipline set.
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
# deny (not forbid) so a targeted per-item #[allow] remains possible where needed.
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_enum_variant = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
